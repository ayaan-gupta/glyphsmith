name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # fontTools lets the suite cross-check every export with a second parser.
      - run: python -m venv .venv && .venv/bin/pip install fonttools brotli
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
